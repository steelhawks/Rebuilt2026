// Orange Pi vision/pose service. Runs a headless AdvantageKit LoggedRobot off
// the RIO (Idun pattern). GradleRIO is applied only to resolve WPILib + vendordep
// dependencies and to provide the `simulateJava` run task; there is NO roboRIO
// deploy target - the Pi is deployed over SSH via deploy_pi.sh (slice 4).
plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

def ROBOT_MAIN_CLASS = "org.steelhawks.pi.PiMain"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// No roboRIO artifact for this project; intentionally empty.
deploy {
    targets {
    }
}

wpi.java.debugJni = false

// arm64 native libs for the Pi deploy jar; resolved only by the jar task.
configurations {
    piNative
}

// PhotonVision publishes photontargeting-cpp for athena / x86-64 / osx only - there
// is no linuxarm64 zip in their maven for any 2026.x release (checked through
// v2026.3.4), even though the vendordep lists linuxarm64 as a valid platform, so
// resolving it 404s. libphotontargetingJNI.so instead comes off the Pi itself:
// deploy_pi.sh pulls it out of /opt/photonvision/photonvision.jar, which is
// version-matched to the PhotonVision instance this service talks to.
configurations.piNative {
    exclude group: "org.photonvision"
}

dependencies {
    // Shared wire contract (protobuf classes + VisionLinkConfig / CONFIG_HASH).
    implementation project(':common')

    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    // Desktop natives so the service can run / replay on a dev box. On the Pi
    // (linuxarm64) the native libs are provided by the WPILib arm64 artifacts at
    // deploy time; see pi-service/README.md.
    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    // Native libs for the Orange Pi (aarch64), bundled into the deploy jar only
    // (see the jar task) - kept out of the compile/sim classpath so local builds
    // don't need arm64 artifacts. The WPILib runtime loader picks the platform at
    // startup. Resolving these requires network access to the WPILib maven.
    piNative wpi.java.deps.wpilibJniRelease(wpi.platforms.linuxarm64)
    piNative wpi.java.vendor.jniRelease(wpi.platforms.linuxarm64)

    def akitJson = new groovy.json.JsonSlurper()
        .parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}

// Unpack the arm64 natives into a plain directory that deploy_pi.sh rsyncs to
// the Pi and the systemd unit puts on java.library.path.
//
// They deliberately do NOT go inside the fat jar: WPILib's RuntimeLoader just
// calls System.loadLibrary(), it never extracts an .so out of the classpath, so
// natives bundled in the jar are invisible at runtime ("no ntcorejni in
// java.library.path"). The libs are flattened into one directory because each
// one is linked with RPATH=$ORIGIN and finds its siblings that way.
tasks.register('piNatives', Sync) {
    description = 'Unpack the linuxarm64 WPILib natives for the Pi deploy.'
    dependsOn configurations.piNative
    from {
        configurations.piNative.collect { zipTree(it) }
    }
    into layout.buildDirectory.dir('piNatives')
    include '**/*.so*'
    exclude '**/*.debug'   // detached debug symbols; ~350 MB of dead weight
    eachFile { it.path = it.name }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Fat jar carrying the whole service + deps, deployed to the Pi alongside
// libposelink_gtsam.so and the natives from piNatives.
jar {
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from sourceSets.main.allSource
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

wpi.java.configureExecutableTasks(jar)

repositories {
    mavenLocal()
    mavenCentral()
    // The WPILib installer only caches desktop + roboRIO artifacts locally. The
    // Pi's linuxarm64 natives (opencv, wpiutil, ntcore, hal, ...) come from the
    // online WPILib maven, so this repo is required to build the deploy jar.
    maven { url = uri("https://frcmaven.wpi.edu/artifactory/release/") }
    maven { url = uri("https://maven.photonvision.org/repository/internal") }
}
