name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: wpilib/roborio-cross-ubuntu:2024-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build robot code
        # :pi-service is a coprocessor app deployed to the Orange Pi over SSH, not
        # a roboRIO artifact - it isn't built in the roboRIO CI. :common (the
        # shared protobuf/config module) still builds since the RIO depends on it.
        run: ./gradlew build -x :pi-service:build
